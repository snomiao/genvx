# Builds the Rust `genvx` binary for every platform, proves that it behaves
# like the TypeScript, packs it together with the TypeScript the package ships,
# and checks on Linux, macOS and Windows (x64 and arm64) that `bun i -g` /
# `npm i -g` gives a working `genvx` command.
#
# It does not publish. Releases still go through release.yml.
#
# The pipeline lives in https://github.com/snomiao/rustify.

name: rust-npm-release

on:
  pull_request:
    paths:
      - "rs/**"
      # The parity job compares the Rust binary with the TypeScript, so a
      # change to the TypeScript has to run it too.
      - "src/**"
      - "package.json"
      - ".github/workflows/rust-npm-release.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without a leading v (default: the version in rs/Cargo.toml)"
        required: false
        type: string

jobs:
  build:
    uses: snomiao/rustify/.github/workflows/rust-npm-build.yml@releases/v1
    with:
      manifest: rs/Cargo.toml
      bins: genvx
      version: ${{ inputs.version }}
      # (--version is no use as the check: it is still answered by yargs,
      # which prints "unknown" when the package was installed with bun.)
      smoke: genvx --help
      smoke-expect: genvx [command] [options]
      # Proof that the Rust binary behaves like the TypeScript, in three parts:
      # the parity cases (GENVX_PACKAGE_ROOT lets the binary hand back what
      # it does not take), a check that the cases meant for Rust were really
      # answered by Rust, and both implementations working on one store.
      parity: >-
        bun install --frozen-lockfile
        && node rs/parity.gen.mjs --check
        && node "$RUSTIFY_PARITY" --cases rs/parity.json --ts "bun src/cli.ts"
        --rs "env GENVX_PACKAGE_ROOT=$GITHUB_WORKSPACE $RUSTIFY_BIN_DIR/genvx"
        && node rs/parity-native.mjs --runner "$RUSTIFY_PARITY" --rs "$RUSTIFY_BIN_DIR/genvx"
        && bash rs/cross-compat.sh "$RUSTIFY_BIN_DIR/genvx"
      # After installing, on every platform: besides `--help`, which the
      # JavaScript still answers, one command the binary answers itself (it
      # prints nothing and exits 0 where genvx is not configured).
      smoke-extra: |
        genvx hooks run post-merge =>
