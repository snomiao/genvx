[package]
name = "genvx"
version = "0.0.0"
edition = "2021"
description = ""
license = "MIT"

[[bin]]
name = "genvx"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[dependencies]
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes"] }
getrandom = "0.4.3"
scrypt = { version = "0.12.0", default-features = false }
sha2 = { version = "0.11.2", default-features = false }
